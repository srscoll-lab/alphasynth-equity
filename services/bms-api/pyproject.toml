[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-intelligence"
version = "0.1.0"
description = "Low-cost AI-last personal stock intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "google-genai>=1.0,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
stockintel = "stock_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
